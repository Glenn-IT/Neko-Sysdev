<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a20"/>
      <stop offset="50%" stop-color="#14143c"/>
      <stop offset="100%" stop-color="#1f184e"/>
    </linearGradient>
    <linearGradient id="amethystGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#3578f5"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a20" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="480" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="280" fill="url(#orb)"/>
  
  <!-- Subtle grid lines -->
  <g stroke="#9b59b6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Status Pill -->
  <rect x="260" y="45" width="280" height="34" rx="17" fill="#131340" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="280" cy="62" r="5" fill="#34d399"/>
  <text x="300" y="68" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">SUCCESSFULLY DEFENDED</text>

  <!-- Graduation Cap Icon -->
  <g transform="translate(370, 110) scale(1.2)">
    <polygon points="25,0 50,12 25,24 0,12" fill="#818cf8"/>
    <path d="M10,18 L10,32 C10,38 40,38 40,32 L40,18" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="45" cy="20" r="3" fill="#fbbf24"/>
    <line x1="45" y1="20" x2="47" y2="36" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Project Title & Details -->
  <text x="400" y="240" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">
    Smart Door Automation System (SDASFC)
  </text>
  
  <text x="400" y="275" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="16" font-weight="500">
    Group Alpha — Cagayan State University
  </text>

  <!-- Badge banner -->
  <rect x="230" y="320" width="340" height="42" rx="10" fill="#0f0f2a" stroke="#6a5acd" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="400" y="347" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="600">
    ★ Grade 1.0 Passed with Distinction ★
  </text>

  <!-- Quote preview -->
  <text x="400" y="410" text-anchor="middle" fill="#9494b8" font-family="system-ui, sans-serif" font-size="14" font-style="italic">
    "Agyaman Kuya! Success and Finally passed our thesis defense!"
  </text>
</svg>
