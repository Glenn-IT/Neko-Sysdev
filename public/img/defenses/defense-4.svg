<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a1c"/>
      <stop offset="50%" stop-color="#220f2e"/>
      <stop offset="100%" stop-color="#150a26"/>
    </linearGradient>
    <radialGradient id="orb4" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#140a1c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="480" fill="url(#bg4)"/>
  <circle cx="400" cy="200" r="280" fill="url(#orb4)"/>

  <!-- Status Pill -->
  <rect x="240" y="45" width="320" height="34" rx="17" fill="#220f2e" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="260" cy="62" r="5" fill="#34d399"/>
  <text x="280" y="68" fill="#f0abfc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">UNANIMOUS PANEL APPROVAL</text>

  <!-- Medal Icon -->
  <g transform="translate(375, 110) scale(1.1)">
    <polygon points="25,5 35,35 15,35" fill="#f43f5e"/>
    <polygon points="55,5 65,35 45,35" fill="#3b82f6"/>
    <circle cx="40" cy="50" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <polygon points="40,38 43,46 51,46 45,51 47,59 40,54 33,59 35,51 29,46 37,46" fill="#ffffff"/>
  </g>

  <!-- Project Title & Details -->
  <text x="400" y="240" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="700">
